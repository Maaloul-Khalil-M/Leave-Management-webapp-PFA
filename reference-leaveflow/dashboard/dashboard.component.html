<app-header
  [profile]="state.profile()"
  [attendance]="state.attendance()"
  (requestLeave)="onRequestLeave()"
  (viewProfile)="onViewProfile()"
  (statusChange)="onStatusChange($event)"
/>

@if (state.loading()) {
  <div class="loading-overlay">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading dashboard…</p>
  </div>
} @else if (state.error()) {
  <div class="error-banner">{{ state.error() }}</div>
} @else {
  <main class="dashboard-grid">
    <aside class="col-left">

      <!-- NEW VERSION -->
      <!-- <app-profile-summary [profile]="state.profile()" /> -->
      <app-upcoming-leaves [items]="state.upcomingLeaves()" />
      <app-team-on-leave [items]="state.teamOnLeave()" />
    </aside>

    <section class="col-center">
      <app-leave-balance [balances]="state.leaveBalances()" />
      <app-balance-calculation [calculation]="state.balanceCalculation()" />
      <app-calendar-view [calendarData]="state.calendarData()" />
      <!-- <app-recent-requests [items]="state.leaveRequests()" /> -->
      <app-leave-ledger [items]="state.leaveLedger()" />
    </section>

    <aside class="col-right">
      <!-- <app-calendar-view [calendarData]="state.calendarData()" /> -->
      <app-company-holidays [items]="state.holidays()" />
      <app-leave-utilization [data]="state.leaveUtilization()" />
      <app-recent-requests [items]="state.leaveRequests()" />
    </aside>
  </main>
}
