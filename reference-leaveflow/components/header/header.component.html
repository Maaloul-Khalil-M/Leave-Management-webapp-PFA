<!-- NEW VERSION -->
<mat-toolbar class="header-toolbar">

  <!-- Mobile hamburger menu -->
  <button
    class="mobile-menu"
    matIconButton
    [matMenuTriggerFor]="menu"
    aria-label="Open navigation menu">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Brand
  <div class="brand">
    <span class="brand-mark">LF</span>
    <span class="brand-name">LEAVEFLOW</span>
  </div>
  -->
<div class="brand">
  <img
    src="assets/LOGO.png"
    alt="Platana"
    class="brand-logo"
  />
</div>

  <!-- Desktop navigation -->
  <nav class="nav-links">
    <a class="nav-link active" href="javascript:void(0)">Dashboard</a>
    <a class="nav-link" href="javascript:void(0)">My Requests</a>
    <a class="nav-link" href="javascript:void(0)">Team Calendar</a>
    <a class="nav-link" href="javascript:void(0)">Policies & FAQs</a>
  </nav>

</mat-toolbar>

<!-- Mobile navigation menu -->
<mat-menu #menu="matMenu">
  <button mat-menu-item>Dashboard</button>
  <button mat-menu-item>My Requests</button>
  <button mat-menu-item>Team Calendar</button>
  <button mat-menu-item>Policies & FAQs</button>
</mat-menu>

  <div class="header-actions">
    @if (attendance(); as att) {
      <mat-button-toggle-group
        [value]="att.status"
        (change)="onStatusChange($event.value)"
        class="status-toggle"
        hideSingleSelectionIndicator>
        <mat-button-toggle value="Office">
          <mat-icon>business</mat-icon>
          Office
        </mat-button-toggle>
        <mat-button-toggle value="Remote">
          <mat-icon>home</mat-icon>
          Remote
        </mat-button-toggle>
      </mat-button-toggle-group>
    }

    <button mat-icon-button class="notif-btn" aria-label="Notifications">
      <mat-icon matBadge="3" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
    </button>

    <button mat-flat-button class="request-btn" (click)="requestLeave.emit()">
      <mat-icon>add</mat-icon>
      Request Leave
    </button>

    @if (profile(); as p) {
      <div class="user-block" [matMenuTriggerFor]="userMenu">
        <div class="avatar">{{ p.name.charAt(0) }}</div>
        <div class="user-meta">
          <span class="user-name">{{ p.name }}</span>
          <span class="user-title">{{ p.position }}</span>
        </div>
        <mat-icon class="chevron">expand_more</mat-icon>
      </div>

      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item (click)="viewProfile.emit()">
          <mat-icon>person</mat-icon>
          View Profile
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          Settings
        </button>
        <button mat-menu-item>
          <mat-icon>logout</mat-icon>
          Sign out
        </button>
      </mat-menu>
    }
  </div>
</mat-toolbar>
