@if (profile(); as p) {
  <mat-card class="profile-card">
    <div class="profile-header">
      <div class="avatar-lg">{{ p.name.charAt(0) }}</div>
      <div class="info">
        <h3 class="name">{{ p.name }}</h3>
        <p class="id">{{ p.id }}</p>
        <mat-chip class="role-chip">{{ p.department }} · {{ p.position }}</mat-chip>
      </div>
    </div>

    <div class="details">
      <div class="detail-row">
        <mat-icon>supervisor_account</mat-icon>
        <div>
          <span class="label">Manager</span>
          <span class="value">{{ p.manager }}</span>
        </div>
      </div>
      <div class="detail-row">
        <mat-icon>trending_up</mat-icon>
        <div>
          <span class="label">Accrual Rate</span>
          <span class="value">{{ p.accrualRate }}</span>
        </div>
      </div>
      <div class="detail-row">
        <mat-icon>calendar_today</mat-icon>
        <div>
          <span class="label">Fiscal Period</span>
          <span class="value">{{ p.fiscalPeriod }}</span>
        </div>
      </div>
    </div>
  </mat-card>
}
