<mat-card class="section-card">
  <div class="card-header">
    <h3>Leave Utilization</h3>
  </div>

  <div class="chart-wrap" #chart></div>

  @if (data(); as d) {
    <div class="custom-legend">
      <div class="legend-row">
        <span class="dot taken"></span>
        <span class="label">Taken</span>
        <span class="value">{{ d.taken }}d</span>
      </div>
      <div class="legend-row">
        <span class="dot planned"></span>
        <span class="label">Planned</span>
        <span class="value">{{ d.planned }}d</span>
      </div>
      <div class="legend-row">
        <span class="dot remaining"></span>
        <span class="label">Remaining</span>
        <span class="value">{{ d.remaining }}d</span>
      </div>
    </div>
  }
</mat-card>
