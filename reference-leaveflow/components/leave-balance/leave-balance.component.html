<div class="balance-grid">
  @for (card of cards(); track card.code) {
    <mat-card class="balance-card">
      <div class="card-top">
        <div class="ring-wrap">
          <svg class="progress-ring" viewBox="0 0 80 80">
            <circle class="ring-bg" cx="40" cy="40" r="36" />
            <circle
              class="ring-fg"
              cx="40"
              cy="40"
              r="36"
              [attr.stroke]="card.color"
              [attr.stroke-dasharray]="card.circumference"
              [attr.stroke-dashoffset]="card.dashOffset"
            />
          </svg>
          <div class="ring-label">
            <span class="remaining">{{ card.remaining | number: '1.0-1' }}</span>
            <span class="unit">left</span>
          </div>
        </div>
        <div class="type-info">
          <h4>{{ card.type }}</h4>
          <p class="totals">{{ card.used | number: '1.0-1' }} used of {{ card.total }}</p>
        </div>
      </div>
    </mat-card>
  }
</div>
