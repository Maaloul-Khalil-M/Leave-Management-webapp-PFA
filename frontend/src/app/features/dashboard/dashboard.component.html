<app-header
  [profile]="state.profile()"
  (requestLeave)="onRequestLeave()"
  (signOut)="onSignOut()"
/>

@if (state.loading()) {
  <div class="loading-overlay">
    <mat-spinner diameter="36"></mat-spinner>
    <p>Loading dashboard…</p>
  </div>
} @else if (state.error()) {
  <div class="error-banner">{{ state.error() }}</div>
} @else {
  <main class="dashboard-container">
    <!-- Top Row: Full-Width Consolidated Entitlement Hub -->
    <section class="top-row">
      <app-leave-balance
        [balances]="state.leaveBalances()"
        [accrualRate]="state.profile()?.accrualRate"
        [fiscalPeriod]="state.profile()?.fiscalPeriod"
        [calculation]="state.balanceCalculation()"
      />
    </section>

    <!-- Operational Dual-Pane Workspace (60% / 40% Split) -->
    <section class="workspace-grid">
      <!-- Left / Primary Workspace: Leave Ledger & Recent Requests -->
      <div class="col-primary">
        <app-leave-ledger [items]="state.leaveLedger()" />
        <app-recent-requests [items]="state.leaveRequests()" />
      </div>

      <!-- Right / Secondary Workspace: Calendar & Unified Schedule Tabs (Upcoming + Holidays) -->
      <div class="col-secondary">
        <app-calendar-view [calendarData]="state.calendarData()" />
        <app-schedule-tabs
          [upcomingLeaves]="state.upcomingApprovedLeaves()"
          [holidays]="state.holidays()"
        />
      </div>
    </section>
  </main>
}
