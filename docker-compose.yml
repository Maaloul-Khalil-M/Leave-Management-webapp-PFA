services:
  mongo:
    image: mongo:7
    container_name: leave-mongo
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # Flamingock needs multi-document transactions, which Mongo only supports
    # on a replica set — even a single-node one. This self-initiates rs0 on
    # first boot; no separate init container needed.
    healthcheck:
      test: >
        mongosh --quiet --port 27017 --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: leave-mongo-express
    restart: unless-stopped
    ports:
      - "8888:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: "admin"
      ME_CONFIG_BASICAUTH_PASSWORD: "admin"
    depends_on:
      mongo:
        condition: service_healthy

  mail:
    image: mailhog/mailhog:v1.0.1
    container_name: leave-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: leave-keycloak
    command: start-dev
    ports:
      - "9090:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:9090
      # Required for the /health/ready endpoint below to exist at all
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: >
        exec 3<>/dev/tcp/127.0.0.1/9000;
        echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3;
        cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  mongo_data:
  keycloak_data:
